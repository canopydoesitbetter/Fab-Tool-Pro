name: Finalize 1.0.7 Progress Hotfix

on:
  push:
    branches: [ work ]
    paths:
      - '.github/workflows/finalize-1.0.7-progress-hotfix.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fabrication_pro_capacitor/package-lock.json
      - name: Update 1.0.7 build metadata and changelog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          release_path = Path('fabrication_pro_capacitor/release.json')
          release = json.loads(release_path.read_text())
          if release.get('version') != '1.0.7':
              raise SystemExit(f"Expected version 1.0.7, found {release.get('version')}")
          if release.get('previousVersion') != '1.0.6':
              raise SystemExit(f"Expected previousVersion 1.0.6, found {release.get('previousVersion')}")
          if release.get('buildNumber') not in (1000015, 1000016):
              raise SystemExit(f"Unexpected 1.0.7 buildNumber {release.get('buildNumber')}")
          release['buildNumber'] = 1000016
          release_path.write_text(json.dumps(release, indent=2) + '\n')

          index_path = Path('fabrication_pro_capacitor/www/index.html')
          text = index_path.read_text()
          marker = "data-changelog-version='1.0.7'"
          start = text.find(marker)
          if start < 0:
              raise SystemExit('1.0.7 changelog entry not found')
          article_start = text.rfind('<article', 0, start)
          article_end = text.find('</article>', start)
          if article_start < 0 or article_end < 0:
              raise SystemExit('Could not bound 1.0.7 changelog article')
          article_end += len('</article>')
          article = text[article_start:article_end]
          line = "          <li><b>Completion Progress:</b> Replaced the decorative fastener rail graphic with a compact live completion display showing X of Y fasteners complete and a progress bar that updates as fastener locations are checked or unchecked, while preserving saved progress across app restarts.</li>\n"
          if '<b>Completion Progress:</b>' not in article:
              ul_end = article.rfind('        </ul>')
              if ul_end < 0:
                  raise SystemExit('Could not find 1.0.7 changelog list ending')
              article = article[:ul_end] + line + article[ul_end:]
              text = text[:article_start] + article + text[article_end:]
              index_path.write_text(text)
          PY
      - name: Install dependencies
        working-directory: fabrication_pro_capacitor
        run: npm ci
      - name: Verify complete app and release contract
        working-directory: fabrication_pro_capacitor
        run: npm run verify
      - name: Commit finalized 1.0.7 hotfix
        run: |
          git config user.name "canopydoesitbetter"
          git config user.email "canopy.2126@gmail.com"
          git add fabrication_pro_capacitor/release.json fabrication_pro_capacitor/www/index.html
          if git diff --cached --quiet; then
            echo "Hotfix metadata already finalized."
            exit 0
          fi
          git commit -m "release: finalize 1.0.7 progress hotfix"
          git push origin HEAD:work
