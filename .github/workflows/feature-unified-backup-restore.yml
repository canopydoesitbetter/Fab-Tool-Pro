name: Unified Backup Restore Feature Gate

on:
  push:
    branches:
      - feature/unified-backup-restore

permissions:
  contents: write

jobs:
  backup-restore-red-green:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fabrication_pro_capacitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply deterministic feature patch when present
        if: ${{ hashFiles('fabrication_pro_capacitor/scripts/apply-unified-backup-restore.mjs') != '' && github.actor != 'github-actions[bot]' }}
        run: node scripts/apply-unified-backup-restore.mjs

      - name: Commit generated implementation when patch changed files
        if: ${{ hashFiles('fabrication_pro_capacitor/scripts/apply-unified-backup-restore.mjs') != '' && github.actor != 'github-actions[bot]' }}
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation diff to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fabrication_pro_capacitor
          git commit -m "feat: implement unified backup restore"
          git push origin HEAD:feature/unified-backup-restore

      - name: Verify backup restore contract
        shell: bash
        run: node scripts/verify-backup-restore.mjs

      - name: Run targeted backup restore browser tests
        run: npx playwright test tests/e2e/backup-restore.spec.mjs
