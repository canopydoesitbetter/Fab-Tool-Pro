name: Unified Backup Restore Feature Gate

on:
  push:
    branches:
      - feature/unified-backup-restore

permissions:
  contents: read

jobs:
  full-feature-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fabrication_pro_capacitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete verification suite
        run: npm run verify

      - name: Run complete browser regression suite
        run: npm run test:e2e
