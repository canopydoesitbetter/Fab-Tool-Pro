name: Apply Persistent Storage Refactor

on:
  workflow_dispatch:
  push:
    branches: [work]
    paths:
      - 'fabrication_pro_capacitor/scripts/apply-persistent-storage-refactor.mjs'
      - '.github/workflows/apply-persistent-storage-refactor.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout work
        uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fabrication_pro_capacitor/package-lock.json
      - name: Install dependencies
        working-directory: fabrication_pro_capacitor
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: fabrication_pro_capacitor
        run: npx playwright install --with-deps chromium
      - name: Apply persistent storage refactor
        working-directory: fabrication_pro_capacitor
        run: node scripts/apply-persistent-storage-refactor.mjs
      - name: Verify source contracts
        working-directory: fabrication_pro_capacitor
        run: npm run verify
      - name: Run full browser regression suite
        working-directory: fabrication_pro_capacitor
        run: npm run test:e2e
      - name: Prove verification is read-only
        working-directory: fabrication_pro_capacitor
        run: git -C .. status --porcelain --untracked-files=no
      - name: Commit verified generated refactor
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fabrication_pro_capacitor/www/app/storage.js \
            fabrication_pro_capacitor/www/app/shift-schedule.js \
            fabrication_pro_capacitor/www/app/task-logging.js \
            fabrication_pro_capacitor/www/app/notes.js \
            fabrication_pro_capacitor/www/app/checklist.js \
            fabrication_pro_capacitor/www/app/quick-reference.js \
            fabrication_pro_capacitor/www/app/sheet-optimizer.js \
            fabrication_pro_capacitor/www/app/import-export.js \
            fabrication_pro_capacitor/www/backup.js \
            fabrication_pro_capacitor/tests/e2e/backup-restore.spec.mjs
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: centralize persistent data schemas'
          git push origin HEAD:work
# rerun after backup verifier migration
