name: Audit Collapsible Jobs Changelog

on:
  push:
    branches: [ feature/v1.0.3-changelog-collapsible-jobs ]
    paths:
      - 'fabrication_pro_capacitor/www/ux.js'
      - 'fabrication_pro_capacitor/scripts/verify-settings-changelog.mjs'
      - '.github/workflows/audit-changelog-collapsible-jobs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.3-changelog-collapsible-jobs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply changelog entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('fabrication_pro_capacitor/www/ux.js')
          text=path.read_text()
          old='          <li>Existing colon-formatted times still work, and impossible times are still rejected instead of being silently changed.</li>'
          extra='          <li>The Task Logging Jobs panel is now collapsible and starts closed by default, matching Task Logging Management while preserving the same saved jobs, totals, running indicators, and job-selection behavior.</li>'
          if old not in text:
              raise SystemExit('Expected v1.0.3 changelog insertion point was not found')
          path.write_text(text.replace(old, old+'\n'+extra, 1))
          PY
      - name: Install dependencies
        working-directory: fabrication_pro_capacitor
        run: npm install --ignore-scripts --package-lock=false
      - name: Verify changelog contract
        working-directory: fabrication_pro_capacitor
        run: npm run verify:settings
      - name: Run complete verification
        working-directory: fabrication_pro_capacitor
        run: npm run verify
      - name: Check focused diff
        run: git diff --check
      - name: Remove temporary audit workflow
        run: rm -f .github/workflows/audit-changelog-collapsible-jobs.yml
      - name: Commit verified changelog update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: add collapsible jobs changelog entry'
          git push origin HEAD:feature/v1.0.3-changelog-collapsible-jobs
