name: Canonical UX Migration Dev Verification

on:
  push:
    branches:
      - refactor/remove-runtime-ux-patch
    paths:
      - 'fabrication_pro_capacitor/**'
      - '.github/workflows/canonical-ux-migration-dev.yml'

permissions:
  contents: write

concurrency:
  group: canonical-ux-migration-dev
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: refactor/remove-runtime-ux-patch
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fabrication_pro_capacitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Repair temporary migration helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/migrate-canonical-ux.mjs')
          lines=path.read_text().splitlines()

          regex_replacement="  const re=new RegExp('function\\\\s+'+name+'\\\\(\\\\)\\\\s*\\\\{\\\\s*return `([\\\\s\\\\S]*?)`;\\\\s*\\\\}');"
          regex_matches=[i for i,line in enumerate(lines) if line.strip().startswith('const re=new RegExp(`function\\\\s+')]
          if len(regex_matches)!=1:
              raise SystemExit(f'Expected one template regex line, found {len(regex_matches)}')
          lines[regex_matches[0]]=regex_replacement

          guard_replacement=r'''  if (source.includes("readFileSync(join(root,'www','ux.js')") || source.includes("readFileSync(join(root,'www','ux.css')") || source.includes("readFileSync(path.join(root,'www','ux.js')") || source.includes("readFileSync(path.join(root,'www','ux.css')")) throw new Error(`${name} still reads a retired UX asset.`);'''
          guard_matches=[i for i,line in enumerate(lines) if 'still references a retired UX asset' in line]
          if len(guard_matches)!=1:
              raise SystemExit(f'Expected one retired-asset guard line, found {len(guard_matches)}')
          lines[guard_matches[0]]=guard_replacement

          path.write_text('\n'.join(lines)+'\n')
          PY

      - name: Syntax-check migration script
        run: node --check scripts/migrate-canonical-ux.mjs

      - name: Apply canonical UX migration
        run: node scripts/migrate-canonical-ux.mjs

      - name: Align Shift verifier with static markup ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('scripts/verify-shift-schedule.mjs')
          source=path.read_text()
          old="expect(app.includes('Length in minutes'),'Break/Lunch duration labels are missing.');"
          new="expect(html.includes('Length in minutes'),'Break/Lunch duration labels are missing.');"
          if old not in source:
              raise SystemExit('Expected migrated Shift duration assertion was not found.')
          path.write_text(source.replace(old,new,1))
          PY

      - name: Inspect generated Settings structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('www/index.html').read_text()
          markers={
              'settings_section': '<section id="tool-settings"',
              'settings_heading': '<h2>Settings</h2>',
              'shift_details': "id='shiftScheduleDetails'",
              'footer': '<div class="footer">Designed by Canopy.</div>',
              'main_close': '</main>',
          }
          for name, marker in markers.items():
              print(f'{name}: {html.find(marker)}')
          start=html.find('<section id="tool-settings"')
          footer=html.find('<div class="footer">Designed by Canopy.</div>')
          print(f'settings section bytes: {footer-start if start >= 0 and footer >= 0 else -1}')
          if start >= 0:
              print('--- SETTINGS PREFIX ---')
              print(html[start:start+1800])
              print('--- SETTINGS SUFFIX ---')
              print(html[max(start, footer-1200):footer+100])
          PY

      - name: Verify canonical source
        run: npm run verify

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused Settings browser diagnostics
        run: npm run test:e2e -- --project=desktop-chromium tests/e2e/navigation.spec.mjs tests/e2e/tasklog-shift.spec.mjs --grep "Settings remains reachable|Shift Schedule UI enables" --workers=1 --timeout=10000

      - name: Run targeted migrated UI tests
        run: npm run test:e2e -- --project=desktop-chromium tests/e2e/navigation.spec.mjs tests/e2e/tasklog-shift.spec.mjs tests/e2e/notes-checklist.spec.mjs

      - name: Run full browser regression suite
        run: npm run test:e2e

      - name: Commit verified migration
        shell: bash
        run: |
          if git diff --quiet -- www scripts; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add www scripts
          git commit -m 'refactor: remove runtime UX patch architecture'
          git push origin HEAD:refactor/remove-runtime-ux-patch

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Canonical-UX-Playwright-Diagnostics
          path: |
            fabrication_pro_capacitor/playwright-report/
            fabrication_pro_capacitor/test-results/
          if-no-files-found: ignore
          retention-days: 14
