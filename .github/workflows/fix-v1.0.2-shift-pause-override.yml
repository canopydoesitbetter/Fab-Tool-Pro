name: Fix v1.0.2 Shift Pause Override

on:
  push:
    branches: [ feature/v1.0.2-shift-schedule ]
    paths:
      - 'scripts/.tmp-v102-fix-pause-override.py'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.0.2-shift-schedule
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies without creating a lockfile
        working-directory: fabrication_pro_capacitor
        run: npm install --ignore-scripts --package-lock=false

      - name: Apply focused pause-override fix
        run: python scripts/.tmp-v102-fix-pause-override.py

      - name: Run live state-engine audit
        working-directory: fabrication_pro_capacitor
        env:
          TZ: America/New_York
        run: npm run verify:shift-schedule-behavior

      - name: Run complete compatibility gate
        working-directory: fabrication_pro_capacitor
        run: npm run verify

      - name: Verify protected identity and clean patch
        run: |
          grep -F '"appId": "com.fabricationpro.app"' fabrication_pro_capacitor/capacitor.config.json
          git diff --check

      - name: Commit focused fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fabrication_pro_capacitor/www/app.js fabrication_pro_capacitor/www/ux.js fabrication_pro_capacitor/package.json fabrication_pro_capacitor/scripts/verify-shift-schedule.mjs fabrication_pro_capacitor/scripts/verify-shift-schedule-behavior.mjs
          git commit -m 'fix: support current-shift pause enable overrides'

      - name: Remove temporary fix scaffolding
        run: |
          git rm scripts/.tmp-v102-fix-pause-override.py .github/workflows/fix-v1.0.2-shift-pause-override.yml
          git commit -m 'chore: remove pause override fix scaffolding'

      - name: Fresh verification on exact final tree
        working-directory: fabrication_pro_capacitor
        env:
          TZ: America/New_York
        run: |
          npm run verify:shift-schedule-behavior
          npm run verify

      - name: Push feature branch only
        run: git push origin HEAD:feature/v1.0.2-shift-schedule
