name: Audit v1.0.4 Collapsible Jobs RED

on:
  push:
    branches: [ feature/v1.0.4-collapsible-jobs ]
    paths:
      - '.github/workflows/audit-v1.0.4-collapsible-jobs-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/v1.0.4-collapsible-jobs
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify collapsible Jobs is RED before implementation
        working-directory: fabrication_pro_capacitor
        run: node scripts/verify-ux-polish.mjs
