name: Build Fabri-Cadabra Installers

on:
  workflow_dispatch:
  push:
    branches: [ main, work ]
    paths:
      - '.github/workflows/build-phone-installers.yml'
      - 'fabrication_pro_capacitor/**'

jobs:
  browser-regression:
    name: Browser Regression Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fabrication_pro_capacitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Fabri-Cadabra source and build configuration
        run: npm run verify

      - name: Run browser regression tests
        run: npm run test:e2e

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Fabri-Cadabra-Playwright-Diagnostics
          path: |
            fabrication_pro_capacitor/playwright-report/
            fabrication_pro_capacitor/test-results/
          if-no-files-found: warn
          retention-days: 14

  android-apk:
    name: Android Permanently Signed APK
    needs: browser-regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify Fabri-Cadabra source and build configuration
        run: npm run verify

      - name: Add and sync Android
        run: |
          npx cap add android
          npx cap sync android
          npm run sync:version
          npm run native:brand -- --android

      - name: Verify Android launcher name
        run: |
          set -euo pipefail
          grep -F '<string name="app_name">Fabri-Cadabra</string>' android/app/src/main/res/values/strings.xml
          grep -F '<string name="title_activity_main">Fabri-Cadabra</string>' android/app/src/main/res/values/strings.xml

      - name: Configure permanent Android release signing
        run: node scripts/android-signing.mjs

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub Actions secret $name is not configured. See docs/ANDROID_SIGNING.md."
              exit 1
            fi
          done

      - name: Restore permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/fabri-cadabra-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null
          echo "Permanent Android signing key restored and validated."

      - name: Build permanently signed release APK
        working-directory: fabrication_pro_capacitor/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/fabri-cadabra-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signing identity, version, and package APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Fabri-Cadabra-Android.apk
          sha256sum dist/Fabri-Cadabra-Android.apk > dist/Fabri-Cadabra-Android.apk.sha256

          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_VERSION_CODE="$(node --input-type=module -e "import { androidVersionCode } from './scripts/app-version.mjs'; import { readFileSync } from 'node:fs'; const pkg=JSON.parse(readFileSync('package.json','utf8')); console.log(androidVersionCode(pkg.version));")"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$AAPT" ]; then
            echo "::error::Android SDK aapt was not found."
            exit 1
          fi
          PACKAGE_LINE="$("$AAPT" dump badging dist/Fabri-Cadabra-Android.apk | head -n 1)"
          ACTUAL_PACKAGE="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION_CODE="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.* versionCode='\([^']*\)'.*/\1/p")"
          ACTUAL_VERSION="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")"
          if [ "$ACTUAL_PACKAGE" != 'com.fabricationpro.app' ] || [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ] || [ "$ACTUAL_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "::error::Finished APK metadata does not match the Fabri-Cadabra release contract."
            echo "Expected: package=com.fabricationpro.app versionName=$EXPECTED_VERSION versionCode=$EXPECTED_VERSION_CODE"
            echo "Actual:   package=${ACTUAL_PACKAGE:-unavailable} versionName=${ACTUAL_VERSION:-unavailable} versionCode=${ACTUAL_VERSION_CODE:-unavailable}"
            exit 1
          fi
          printf 'package=%s\nversionName=%s\nversionCode=%s\n' "$ACTUAL_PACKAGE" "$ACTUAL_VERSION" "$ACTUAL_VERSION_CODE" | tee dist/Fabri-Cadabra-Android-version.txt

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android SDK apksigner was not found."
            exit 1
          fi
          SIGNING_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs dist/Fabri-Cadabra-Android.apk)"
          printf '%s\n' "$SIGNING_OUTPUT" | tee dist/Fabri-Cadabra-Android-signing.txt

          ACTUAL_FINGERPRINT="$(printf '%s\n' "$SIGNING_OUTPUT" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          EXPECTED_FINGERPRINT="$(tr -d '[:space:]:' < docs/ANDROID_SIGNING_CERT_SHA256.txt | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL_FINGERPRINT" ] || [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::APK signing certificate does not match the permanent Fabri-Cadabra certificate."
            echo "Expected: $EXPECTED_FINGERPRINT"
            echo "Actual:   ${ACTUAL_FINGERPRINT:-unavailable}"
            exit 1
          fi
          echo "Permanent Android certificate fingerprint verified: $ACTUAL_FINGERPRINT"

      - name: Upload Android installer
        uses: actions/upload-artifact@v4
        with:
          name: Fabri-Cadabra-Android-APK
          path: |
            fabrication_pro_capacitor/dist/Fabri-Cadabra-Android.apk
            fabrication_pro_capacitor/dist/Fabri-Cadabra-Android.apk.sha256
            fabrication_pro_capacitor/dist/Fabri-Cadabra-Android-version.txt
            fabrication_pro_capacitor/dist/Fabri-Cadabra-Android-signing.txt
          if-no-files-found: error
          retention-days: 30

  ios-unsigned-ipa:
    name: iPhone IPA for SideStore or AltStore
    needs: browser-regression
    runs-on: macos-15
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify Fabri-Cadabra source
        run: npm run verify

      - name: Add and sync iOS
        run: |
          npx cap add ios
          npx cap sync ios
          npm run sync:version
          npm run native:brand -- --ios

      - name: Verify iOS display name
        run: |
          set -euo pipefail
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' ios/App/App/Info.plist)"
          test "$DISPLAY_NAME" = 'Fabri-Cadabra'
          echo "iOS display name verified: $DISPLAY_NAME"

      - name: Register required iOS privacy manifest
        run: node --input-type=module -e "import { installIosPrivacyManifest } from './scripts/ios-privacy.mjs'; installIosPrivacyManifest(process.cwd());"

      - name: Build unsigned physical-device app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package and verify unsigned IPA
        run: |
          set -euxo pipefail
          APP_PATH="$PWD/build/ios/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p "$PWD/dist/Payload"
          cp -R "$APP_PATH" "$PWD/dist/Payload/Fabri-Cadabra.app"
          cd "$PWD/dist"
          /usr/bin/zip -qry Fabri-Cadabra-iPhone-Unsigned.ipa Payload
          rm -rf Payload
          shasum -a 256 Fabri-Cadabra-iPhone-Unsigned.ipa > Fabri-Cadabra-iPhone-Unsigned.ipa.sha256

          EXPECTED_VERSION="$(node -p "require('../package.json').version")"
          INFO_PLIST="$RUNNER_TEMP/Fabri-Cadabra-Info.plist"
          unzip -p Fabri-Cadabra-iPhone-Unsigned.ipa 'Payload/Fabri-Cadabra.app/Info.plist' > "$INFO_PLIST"
          ACTUAL_PACKAGE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"
          if [ "$ACTUAL_PACKAGE" != 'com.fabricationpro.app' ] || [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ] || [ "$ACTUAL_BUILD" != "$EXPECTED_VERSION" ]; then
            echo "::error::Finished IPA metadata does not match the Fabri-Cadabra release contract."
            echo "Expected: bundle=com.fabricationpro.app version=$EXPECTED_VERSION build=$EXPECTED_VERSION"
            echo "Actual:   bundle=${ACTUAL_PACKAGE:-unavailable} version=${ACTUAL_VERSION:-unavailable} build=${ACTUAL_BUILD:-unavailable}"
            exit 1
          fi
          printf 'bundleIdentifier=%s\nCFBundleShortVersionString=%s\nCFBundleVersion=%s\n' "$ACTUAL_PACKAGE" "$ACTUAL_VERSION" "$ACTUAL_BUILD" | tee Fabri-Cadabra-iPhone-Unsigned-version.txt

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fabri-Cadabra-iPhone-Unsigned-IPA
          path: |
            fabrication_pro_capacitor/dist/Fabri-Cadabra-iPhone-Unsigned.ipa
            fabrication_pro_capacitor/dist/Fabri-Cadabra-iPhone-Unsigned.ipa.sha256
            fabrication_pro_capacitor/dist/Fabri-Cadabra-iPhone-Unsigned-version.txt
          if-no-files-found: error
          retention-days: 30
