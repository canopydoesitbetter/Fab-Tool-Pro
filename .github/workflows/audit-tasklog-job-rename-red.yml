name: Audit Task Logging Job Rename RED

on:
  push:
    branches: [ feature/v1.0.3-tasklog-job-rename ]
    paths:
      - 'fabrication_pro_capacitor/scripts/verify-tasklog-job-rename.mjs'
      - '.github/workflows/audit-tasklog-job-rename-red.yml'
  workflow_dispatch:

jobs:
  verify-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify rename contract fails before implementation
        working-directory: fabrication_pro_capacitor
        run: node scripts/verify-tasklog-job-rename.mjs
