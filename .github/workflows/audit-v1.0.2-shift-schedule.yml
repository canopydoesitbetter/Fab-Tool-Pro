name: Audit v1.0.2 Shift Schedule

on:
  push:
    branches: [ feature/v1.0.2-shift-schedule ]
    paths:
      - 'fabrication_pro_capacitor/scripts/verify-shift-schedule-behavior.mjs'
      - 'fabrication_pro_capacitor/package.json'
      - 'fabrication_pro_capacitor/www/app.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.0.2-shift-schedule
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies without creating a lockfile
        working-directory: fabrication_pro_capacitor
        run: npm install --ignore-scripts --package-lock=false

      - name: Run state-engine behavioral audit
        working-directory: fabrication_pro_capacitor
        env:
          TZ: America/New_York
        run: node scripts/verify-shift-schedule-behavior.mjs

      - name: Run complete repository verification
        working-directory: fabrication_pro_capacitor
        run: npm run verify

      - name: Confirm verification did not dirty tracked files
        run: git diff --exit-code
