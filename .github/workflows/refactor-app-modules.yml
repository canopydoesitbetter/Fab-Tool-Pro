name: Temporary App Module Refactor

on:
  push:
    branches: [ work ]
    paths:
      - '.github/workflows/refactor-app-modules.yml'
      - 'fabrication_pro_capacitor/scripts/split-app-modules.mjs'
      - 'fabrication_pro_capacitor/scripts/fix-module-verifiers.mjs'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Checkout work
        uses: actions/checkout@v4
        with:
          ref: work

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fabrication_pro_capacitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Mechanically split app.js
        run: node scripts/split-app-modules.mjs

      - name: Focus pure behavior verifiers on their modules
        run: node scripts/fix-module-verifiers.mjs

      - name: Verify complete regression suite
        run: npm run verify

      - name: Run browser regression tests
        run: npm run test:e2e

      - name: Commit verified module extraction
        working-directory: .
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: split app into feature modules'
          git push origin HEAD:work
