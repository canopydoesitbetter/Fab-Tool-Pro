name: Apply Release Continuity Repair V4

on:
  push:
    branches: [ work ]
    paths:
      - '.github/workflows/apply-release-continuity-v4.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work
        uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fabrication_pro_capacitor/package-lock.json

      - name: Prepare one-time release repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('fabrication_pro_capacitor/scripts/apply-release-continuity.mjs')
          text=path.read_text()
          text=text.replace(r'(<\\/strong>)', r'(<\/strong>)')
          text=text.replace(r'[\\s\\S]*?<\\/article>', r'[\s\S]*?<\/article>')
          path.write_text(text)
          PY
          node --check fabrication_pro_capacitor/scripts/apply-release-continuity.mjs

      - name: Apply deterministic release repair
        run: node fabrication_pro_capacitor/scripts/apply-release-continuity.mjs

      - name: Migrate stale release pins to canonical release metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          verifier=Path('fabrication_pro_capacitor/scripts/verify-backup-restore.mjs')
          text=verifier.read_text()
          old="need(pkg.version==='1.0.5',`Audit #4 must not bump app version; found ${pkg.version}.`);"
          new="const release=JSON.parse(readFileSync(join(root,'release.json'),'utf8'));\nneed(pkg.version===release.version,`Backup verifier package version ${pkg.version} must match release metadata ${release.version}.`);"
          if old not in text:
              raise SystemExit('Expected stale backup verifier version pin was not found.')
          verifier.write_text(text.replace(old,new))

          test=Path('fabrication_pro_capacitor/tests/e2e/backup-restore.spec.mjs')
          text=test.read_text()
          first="import { test, expect } from '@playwright/test';"
          if first not in text:
              raise SystemExit('Playwright import marker was not found.')
          text=text.replace(first,"import { readFileSync } from 'node:fs';\n"+first,1)
          helper="import { acceptNextDialog, captureJsonDownload, expectNoHorizontalOverflow, expectWithinViewport, openApp, openTool } from './helpers.mjs';"
          if helper not in text:
              raise SystemExit('Playwright helper import marker was not found.')
          text=text.replace(helper,helper+"\n\nconst RELEASE=JSON.parse(readFileSync(new URL('../../release.json',import.meta.url),'utf8'));",1)
          old_expect="expect(exported.json.appVersion).toBe('1.0.5');"
          if old_expect not in text:
              raise SystemExit('Expected stale backup E2E version pin was not found.')
          test.write_text(text.replace(old_expect,"expect(exported.json.appVersion).toBe(RELEASE.version);",1))
          PY
          node --check fabrication_pro_capacitor/scripts/verify-backup-restore.mjs
          node --check fabrication_pro_capacitor/tests/e2e/backup-restore.spec.mjs

      - name: Install dependencies
        working-directory: fabrication_pro_capacitor
        run: npm ci

      - name: Verify source and release contracts
        working-directory: fabrication_pro_capacitor
        run: npm run verify

      - name: Install Playwright Chromium
        working-directory: fabrication_pro_capacitor
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        working-directory: fabrication_pro_capacitor
        run: npm run test:e2e

      - name: Prove aggregate verify is read-only
        working-directory: fabrication_pro_capacitor
        run: |
          set -euo pipefail
          BEFORE="$(git -C .. diff -- .)"
          npm run verify
          AFTER="$(git -C .. diff -- .)"
          test "$BEFORE" = "$AFTER"
          echo 'npm run verify did not modify tracked files.'

      - name: Remove one-time repair scaffolding
        run: |
          rm fabrication_pro_capacitor/scripts/apply-release-continuity.mjs
          rm .github/workflows/apply-release-continuity.yml
          rm .github/workflows/apply-release-continuity-v2.yml
          rm .github/workflows/apply-release-continuity-v3.yml
          rm .github/workflows/apply-release-continuity-v4.yml

      - name: Commit verified release repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: repair 1.0.4 version continuity'
          git push origin HEAD:work
