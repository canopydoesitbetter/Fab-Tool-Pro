name: Verify Task Logging Launch and Page Order

on:
  push:
    branches: [ refactor/tasklog-launch-page-order ]
    paths:
      - '.github/workflows/verify-tasklog-launch-page-order.yml'
      - 'fabrication_pro_capacitor/www/index.html'
      - 'fabrication_pro_capacitor/www/app.js'
      - 'fabrication_pro_capacitor/scripts/verify-features.mjs'
      - 'fabrication_pro_capacitor/scripts/tasklog_launch_page_order_migration.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/tasklog-launch-page-order
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply approved page launch and ordering changes
        run: python scripts/tasklog_launch_page_order_migration.py
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify full project
        run: npm run verify
      - name: Commit production changes when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- www/index.html www/app.js; then
            echo 'No production migration changes to commit.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add www/index.html www/app.js
          git commit -m 'feat: make Task Logging the launch page'
          git push origin HEAD:refactor/tasklog-launch-page-order
