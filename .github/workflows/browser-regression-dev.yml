name: Browser Regression Dev Verification

on:
  push:
    branches: [ test/browser-regression-suite ]
    paths:
      - '.github/workflows/browser-regression-dev.yml'
      - 'fabrication_pro_capacitor/**'

permissions:
  contents: write

jobs:
  verify:
    name: Feature branch browser verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: test/browser-regression-suite

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated package lock if needed
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- fabrication_pro_capacitor/package-lock.json; then
            echo "package-lock.json already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fabrication_pro_capacitor/package-lock.json
          git commit -m "test: regenerate lockfile for Playwright"
          git push origin HEAD:test/browser-regression-suite

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run existing verification
        run: npm run verify

      - name: Run browser smoke test
        run: npm run test:e2e -- --project=desktop-chromium tests/e2e/navigation.spec.mjs

      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-dev-diagnostics
          path: |
            fabrication_pro_capacitor/playwright-report
            fabrication_pro_capacitor/test-results
          if-no-files-found: ignore
