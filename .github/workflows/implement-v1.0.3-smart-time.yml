name: Implement v1.0.3 Smart Time Input

on:
  push:
    branches:
      - feature/v1.0.3-smart-time-input
    paths:
      - '.github/workflows/implement-v1.0.3-smart-time.yml'
      - 'fabrication_pro_capacitor/scripts/apply-v1.0.3-smart-time-fix.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.0.3-smart-time-input
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply focused patch
        run: python3 fabrication_pro_capacitor/scripts/apply-v1.0.3-smart-time-fix.py

      - name: Install dependencies without creating a lockfile
        working-directory: fabrication_pro_capacitor
        run: npm install --ignore-scripts --package-lock=false

      - name: Sync canonical version
        working-directory: fabrication_pro_capacitor
        run: npm run sync:version

      - name: Verify smart time input GREEN
        working-directory: fabrication_pro_capacitor
        run: npm run verify:smart-time

      - name: Verify JavaScript syntax
        working-directory: fabrication_pro_capacitor
        run: node --check www/ux.js

      - name: Run complete repository verification
        working-directory: fabrication_pro_capacitor
        run: npm run verify

      - name: Confirm protected app identity and patch hygiene
        run: |
          git diff --check
          grep -F '"appId": "com.fabricationpro.app"' fabrication_pro_capacitor/capacitor.config.json
          test "$(node -p "require('./fabrication_pro_capacitor/package.json').version")" = '1.0.3'

      - name: Remove temporary scaffolding
        run: |
          rm -f .github/workflows/audit-v1.0.3-smart-time-red.yml
          rm -f .github/workflows/implement-v1.0.3-smart-time.yml
          rm -f fabrication_pro_capacitor/scripts/apply-v1.0.3-smart-time-fix.py

      - name: Commit and push verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make shift time entry phone friendly'
          git push origin HEAD:feature/v1.0.3-smart-time-input
