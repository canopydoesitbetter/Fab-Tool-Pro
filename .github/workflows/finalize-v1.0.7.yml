name: Finalize Fabri-Cadabra 1.0.7

on:
  push:
    branches: [ release-v1.0.7 ]
    paths:
      - '.github/workflows/finalize-v1.0.7.yml'

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize and verify v1.0.7
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release-v1.0.7
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fabrication_pro_capacitor/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Finalize release metadata and changelog
        run: node ../.github/scripts/finalize-v1.0.7.mjs
      - name: Synchronize generated app version
        run: npm run sync:version
      - name: Verify complete release contract
        run: npm run verify
      - name: Verify patch formatting
        run: git -C .. diff --check
      - name: Commit finalized release
        run: |
          set -euo pipefail
          git -C .. config user.name 'github-actions[bot]'
          git -C .. config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .. add fabrication_pro_capacitor/package.json fabrication_pro_capacitor/package-lock.json fabrication_pro_capacitor/release.json fabrication_pro_capacitor/www/app/bootstrap.js fabrication_pro_capacitor/www/index.html
          if git -C .. diff --cached --quiet; then
            echo 'Release files already finalized.'
            exit 0
          fi
          git -C .. commit -m 'release: finalize v1.0.7'
          git -C .. push origin HEAD:release-v1.0.7
