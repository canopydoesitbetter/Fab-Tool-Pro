name: Checklist Drag Reorder Branch Verification

on:
  push:
    branches: [ feature/checklist-drag-reorder ]
    paths:
      - '.github/workflows/checklist-drag-reorder-branch.yml'
      - 'fabrication_pro_capacitor/scripts/apply-checklist-drag-reorder.mjs'

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/checklist-drag-reorder
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm regression verifier is red before implementation
        run: |
          set +e
          npm run verify:features > /tmp/checklist-red.log 2>&1
          status=$?
          set -e
          cat /tmp/checklist-red.log
          if [ "$status" -eq 0 ]; then
            echo "::error::Checklist reorder regression verifier unexpectedly passed before implementation."
            exit 1
          fi
          grep -F 'Checklist drag/reorder behavior marker missing' /tmp/checklist-red.log
          echo 'Expected RED state confirmed.'

      - name: Apply approved checklist reorder implementation
        run: node scripts/apply-checklist-drag-reorder.mjs

      - name: Verify implementation
        run: npm run verify

      - name: Check diff whitespace
        working-directory: .
        run: git diff --check

      - name: Commit verified canonical source
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fabrication_pro_capacitor/www/app.js fabrication_pro_capacitor/www/styles.css
          git diff --cached --quiet && { echo '::error::Updater produced no source changes.'; exit 1; }
          git commit -m 'Add checklist drag reordering'
          git push origin HEAD:feature/checklist-drag-reorder
