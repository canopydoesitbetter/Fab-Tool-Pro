name: Finalize Persistence Release

on:
  push:
    branches: [work]
    paths:
      - '.github/workflows/finalize-persistence-release.yml'

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout work
        uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fabrication_pro_capacitor/package-lock.json

      - name: Install dependencies
        working-directory: fabrication_pro_capacitor
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: fabrication_pro_capacitor
        run: npx playwright install --with-deps chromium

      - name: Apply release metadata and changelog
        run: |
          node <<'NODE'
          const fs=require('fs');
          const base='fabrication_pro_capacitor';
          const releasePath=`${base}/release.json`;
          const packagePath=`${base}/package.json`;
          const configPath=`${base}/capacitor.config.json`;
          const indexPath=`${base}/www/index.html`;

          const release=JSON.parse(fs.readFileSync(releasePath,'utf8'));
          const pkg=JSON.parse(fs.readFileSync(packagePath,'utf8'));
          const config=JSON.parse(fs.readFileSync(configPath,'utf8'));
          if (release.version!=='1.0.4' || pkg.version!=='1.0.4') throw new Error('Public version must remain 1.0.4.');
          if (release.previousVersion!=='1.0.3') throw new Error('previousVersion must remain 1.0.3.');
          if (config.appId!=='com.fabricationpro.app') throw new Error('Capacitor app ID changed unexpectedly.');
          release.buildNumber=1000007;
          fs.writeFileSync(releasePath,JSON.stringify(release,null,2)+'\n');

          let html=fs.readFileSync(indexPath,'utf8');
          const bullet="    <li><b>Persistent Data Schemas &amp; Migrations:</b> Centralized all 10 saved-data stores behind versioned schemas and explicit migrations, preserves original raw data before risky upgrades, reports corrupt or future-version data without silently overwriting it, and keeps schema-v1 full backups restorable through backup schema v2.</li>";
          if (!html.includes(bullet)) {
            const start=html.indexOf("<article class='changelog-entry changelog-release' data-changelog-version='1.0.4'>");
            if (start<0) throw new Error('1.0.4 changelog entry not found.');
            const end=html.indexOf('</article>',start);
            if (end<0) throw new Error('1.0.4 changelog entry is incomplete.');
            const close=html.lastIndexOf('  </ul>',end);
            if (close<start) throw new Error('1.0.4 changelog list not found.');
            html=html.slice(0,close)+bullet+'\n'+html.slice(close);
            fs.writeFileSync(indexPath,html);
          }
          NODE

      - name: Verify source contracts
        working-directory: fabrication_pro_capacitor
        run: npm run verify

      - name: Run full browser regression suite
        working-directory: fabrication_pro_capacitor
        run: npm run test:e2e

      - name: Verify intended release diff
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const release=JSON.parse(fs.readFileSync('fabrication_pro_capacitor/release.json','utf8'));
          const pkg=JSON.parse(fs.readFileSync('fabrication_pro_capacitor/package.json','utf8'));
          const config=JSON.parse(fs.readFileSync('fabrication_pro_capacitor/capacitor.config.json','utf8'));
          if (release.version!=='1.0.4' || release.buildNumber!==1000007 || release.previousVersion!=='1.0.3') throw new Error('Release metadata mismatch.');
          if (pkg.version!=='1.0.4') throw new Error('Package public version changed.');
          if (config.appId!=='com.fabricationpro.app' || config.appName!=='Fabri-Cadabra' || config.webDir!=='www') throw new Error('Capacitor identity changed.');
          NODE
          git diff --check

      - name: Commit verified release state and remove guard
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-persistence-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fabrication_pro_capacitor/release.json fabrication_pro_capacitor/www/index.html .github/workflows/finalize-persistence-release.yml
          git commit -m 'feat: finalize persistent data migrations release'
          git push origin HEAD:work
