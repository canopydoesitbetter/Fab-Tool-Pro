name: Finalize v1.0.4 Native Branding v2

on:
  push:
    branches: [ feature/v1.0.4-native-branding-release10 ]
    paths:
      - '.github/workflows/finalize-v104-branding-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: feature/v1.0.4-native-branding-release10
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm native-branding regression starts RED
        working-directory: fabrication_pro_capacitor
        run: |
          set +e
          node scripts/verify-native-branding.mjs > /tmp/native-branding-red.log 2>&1
          status=$?
          set -e
          cat /tmp/native-branding-red.log
          if [ "$status" -eq 0 ]; then
            echo '::error::Native branding regression unexpectedly passed before implementation.'
            exit 1
          fi
          echo 'Expected RED confirmed for native branding contract.'

      - name: Install image tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

      - name: Build permanent Fabri-Cadabra brand assets
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/fabrication_pro_capacitor"
          OUT="$ROOT/assets/native-branding"
          mkdir -p "$OUT"

          SOURCE=''
          for dir in brand-source brand-transfer source-parts; do
            shopt -s nullglob
            parts=("$ROOT/assets/$dir"/icon.*.b64)
            shopt -u nullglob
            if [ "${#parts[@]}" -eq 0 ]; then continue; fi
            echo "Testing staged image source: $dir (${#parts[@]} part(s))"
            if ! cat "${parts[@]}" | tr -d '\r\n' | base64 --decode > /tmp/fabri-icon-candidate 2>/dev/null; then
              echo "Skipping $dir: base64 decode failed."
              continue
            fi
            rm -f /tmp/fabri-probe.png
            if convert /tmp/fabri-icon-candidate -resize 16x16 /tmp/fabri-probe.png >/dev/null 2>&1 && [ -s /tmp/fabri-probe.png ]; then
              cp /tmp/fabri-icon-candidate /tmp/fabri-icon-source
              SOURCE="$dir"
              break
            fi
            echo "Skipping $dir: image stream is not fully decodable."
          done
          if [ -z "$SOURCE" ]; then
            echo '::error::Could not reconstruct a fully decodable approved Fabri-Cadabra icon source.'
            exit 1
          fi
          echo "Using staged approved icon source: $SOURCE"

          convert /tmp/fabri-icon-source -resize 1024x1024! -strip -quality 92 "$OUT/icon.jpg"
          identify "$OUT/icon.jpg"

          convert "$OUT/icon.jpg" \
            -resize '2732x2732^' -gravity center -extent 2732x2732 \
            -blur 0x70 -fill '#07030f' -colorize 48 \
            /tmp/fabri-splash-bg.jpg
          convert "$OUT/icon.jpg" -resize 1250x1250 /tmp/fabri-splash-logo.png
          convert /tmp/fabri-splash-bg.jpg /tmp/fabri-splash-logo.png \
            -gravity center -geometry +0-285 -composite \
            -font DejaVu-Serif -pointsize 190 -fill '#f6efff' \
            -stroke '#5d23a8' -strokewidth 3 \
            -gravity center -annotate +0+610 'Fabri-Cadabra' \
            -strip -quality 90 "$OUT/splash.jpg"
          identify "$OUT/splash.jpg"

          rm -rf "$ROOT/assets/brand-source" "$ROOT/assets/brand-transfer" "$ROOT/assets/source-parts"

      - name: Add native branding implementation
        run: |
          cat > fabrication_pro_capacitor/scripts/apply-native-branding.mjs <<'EOF'
          import { copyFileSync, existsSync, mkdtempSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';

          const root=process.cwd();
          const sourceDir=join(root,'assets','native-branding');
          const icon=join(sourceDir,'icon.jpg');
          const splash=join(sourceDir,'splash.jpg');
          if (!existsSync(icon) || !existsSync(splash)) {
            console.error('Fabri-Cadabra native branding assets are missing.');
            process.exit(1);
          }

          const temp=mkdtempSync(join(tmpdir(),'fabri-cadabra-native-assets-'));
          try {
            for (const name of ['icon-only.jpg','icon-foreground.jpg','icon-background.jpg']) copyFileSync(icon,join(temp,name));
            for (const name of ['splash.jpg','splash-dark.jpg']) copyFileSync(splash,join(temp,name));
            const platformArgs=[];
            if (process.argv.includes('--android')) platformArgs.push('--android');
            if (process.argv.includes('--ios')) platformArgs.push('--ios');
            const npx=process.platform==='win32' ? 'npx.cmd' : 'npx';
            const result=spawnSync(npx,['--yes','@capacitor/assets@3.0.5','generate','--assetPath',temp,...platformArgs],{
              cwd:root,
              stdio:'inherit',
              shell:false
            });
            if (result.status!==0) process.exit(result.status ?? 1);
          } finally {
            rmSync(temp,{recursive:true,force:true});
          }
          console.log('Fabri-Cadabra native icon and launch-screen branding generated.');
          EOF

      - name: Wire v1.0.4 version, changelog, native init, and verification
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('fabrication_pro_capacitor')

          pkg_path=root/'package.json'
          pkg=json.loads(pkg_path.read_text())
          pkg['version']='1.0.4'
          scripts=pkg['scripts']
          scripts['native:brand']='node scripts/apply-native-branding.mjs'
          scripts['verify:native-branding']='node scripts/verify-native-branding.mjs'
          if 'npm run verify:native-branding' not in scripts['verify']:
              scripts['verify']=scripts['verify'].replace('npm run verify:native-shim &&','npm run verify:native-shim && npm run verify:native-branding &&')
          pkg_path.write_text(json.dumps(pkg,indent=2)+'\n')

          native_path=root/'scripts/native-init.mjs'
          native=native_path.read_text()
          brand_line="run(process.platform === 'win32' ? 'npm.cmd' : 'npm', ['run', 'native:brand']);"
          if brand_line not in native:
              native=native.replace("cap('sync');", "cap('sync');\n"+brand_line)
          native_path.write_text(native)

          ux_path=root/'www/ux.js'
          ux=ux_path.read_text()
          ux=ux.replace("const FABRI_CADABRA_VERSION='1.0.3';", "const FABRI_CADABRA_VERSION='1.0.4';")
          start=ux.index("      <article class='changelog-entry changelog-release' data-changelog-version='current'>")
          end=ux.index("      <article class='changelog-entry changelog-release' data-changelog-version='1.0.2'>",start)
          old=ux[start:end]
          historical=old.replace("data-changelog-version='current'","data-changelog-version='1.0.3'",1).replace("Version ${FABRI_CADABRA_VERSION}","Version 1.0.3",1)
          current="""      <article class='changelog-entry changelog-release' data-changelog-version='current'>
              <div class='changelog-entry-heading'>
                <div>
                  <span class='changelog-version-label'>Version ${FABRI_CADABRA_VERSION}</span>
                  <h2>Fabri-Cadabra Branding Refresh</h2>
                </div>
              </div>
              <ul>
                <li>Added the new Fabri-Cadabra launcher icon on Android and iPhone, replacing the default Capacitor branding.</li>
                <li>Added a branded launch screen with the Fabri-Cadabra logo centered and the app name directly underneath.</li>
                <li>Native branding is generated through the same repeatable Capacitor build pipeline used for production installers.</li>
              </ul>
            </article>
          """
          ux=ux[:start]+current+historical+ux[end:]
          ux_path.write_text(ux)

          settings_path=root/'scripts/verify-settings-changelog.mjs'
          s=settings_path.read_text()
          s=s.replace("const expectedVersion='1.0.3';","const expectedVersion='1.0.4';")
          old_order="""const currentIndex=changelogFunction.indexOf(\"data-changelog-version='current'\");
          const v102Index=changelogFunction.indexOf(\"data-changelog-version='1.0.2'\");
          const v101Index=changelogFunction.indexOf(\"data-changelog-version='1.0.1'\");
          const baselineCallIndex=changelogFunction.indexOf('${currentFeaturesChangelogMarkup()}');
          if (!(currentIndex>=0 && v102Index>currentIndex && v101Index>v102Index && baselineCallIndex>v101Index)) throw new Error('Changelog renderer must output v1.0.3, then v1.0.2, then v1.0.1, then the v1.0.0 baseline.');"""
          new_order="""const currentIndex=changelogFunction.indexOf(\"data-changelog-version='current'\");
          const v103Index=changelogFunction.indexOf(\"data-changelog-version='1.0.3'\");
          const v102Index=changelogFunction.indexOf(\"data-changelog-version='1.0.2'\");
          const v101Index=changelogFunction.indexOf(\"data-changelog-version='1.0.1'\");
          const baselineCallIndex=changelogFunction.indexOf('${currentFeaturesChangelogMarkup()}');
          if (!(currentIndex>=0 && v103Index>currentIndex && v102Index>v103Index && v101Index>v102Index && baselineCallIndex>v101Index)) throw new Error('Changelog renderer must output v1.0.4, then v1.0.3, then v1.0.2, then v1.0.1, then the v1.0.0 baseline.');"""
          if old_order not in s:
              raise SystemExit('Could not update changelog ordering verifier.')
          s=s.replace(old_order,new_order)
          s=s.replace("requireMatch(ux,/data-changelog-version='current'[\\s\\S]*?<h2>Smart Shift Time Entry<\\/h2>/,'Current changelog entry must describe Smart Shift Time Entry.');",
                      "requireMatch(ux,/data-changelog-version='current'[\\s\\S]*?<h2>Fabri-Cadabra Branding Refresh<\\/h2>/,'Current changelog entry must describe the v1.0.4 branding refresh.');\nrequireMatch(ux,/data-changelog-version='1.0.3'[\\s\\S]*?<h2>Smart Shift Time Entry<\\/h2>/,'v1.0.3 Smart Shift Time Entry changelog entry must be retained.');")
          settings_path.write_text(s)
          PY

          cat > fabrication_pro_capacitor/scripts/verify-native-branding.mjs <<'EOF'
          import { existsSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';

          const root=process.cwd();
          function requireText(source,needle,message){ if(!source.includes(needle)) throw new Error(message); }
          function jpegDimensions(buffer){
            if(buffer.length<4 || buffer[0]!==0xff || buffer[1]!==0xd8) throw new Error('Native branding source is not a JPEG.');
            let offset=2;
            while(offset+9<buffer.length){
              if(buffer[offset]!==0xff){ offset++; continue; }
              const marker=buffer[offset+1];
              if(marker===0xd8 || marker===0xd9){ offset+=2; continue; }
              if(offset+4>buffer.length) break;
              const length=buffer.readUInt16BE(offset+2);
              if(length<2 || offset+2+length>buffer.length) break;
              if([0xc0,0xc1,0xc2,0xc3,0xc5,0xc6,0xc7,0xc9,0xca,0xcb,0xcd,0xce,0xcf].includes(marker)) return {height:buffer.readUInt16BE(offset+5),width:buffer.readUInt16BE(offset+7)};
              offset+=2+length;
            }
            throw new Error('Could not read native branding JPEG dimensions.');
          }

          const rules=[['assets/native-branding/icon.jpg',1024,1024],['assets/native-branding/splash.jpg',2732,2732]];
          for(const [rel,minW,minH] of rules){
            const path=join(root,rel);
            if(!existsSync(path)) throw new Error(`Missing native branding asset: ${rel}`);
            const {width,height}=jpegDimensions(readFileSync(path));
            if(width<minW || height<minH) throw new Error(`${rel} must be at least ${minW}x${minH}; found ${width}x${height}.`);
          }
          for(const rel of ['assets/brand-source','assets/brand-transfer','assets/source-parts']) if(existsSync(join(root,rel))) throw new Error(`Temporary branding transfer directory must not ship: ${rel}`);

          const pkg=JSON.parse(readFileSync(join(root,'package.json'),'utf8'));
          if(pkg.version!=='1.0.4') throw new Error(`Native branding release must be v1.0.4; found ${pkg.version}.`);
          requireText(String(pkg.scripts?.['native:brand']||''),'apply-native-branding.mjs','package.json must expose native:brand.');
          requireText(String(pkg.scripts?.['verify:native-branding']||''),'verify-native-branding.mjs','package.json must expose verify:native-branding.');
          requireText(String(pkg.scripts?.verify||''),'npm run verify:native-branding','Aggregate npm run verify must include native branding verification.');

          const apply=readFileSync(join(root,'scripts','apply-native-branding.mjs'),'utf8');
          for(const marker of ['@capacitor/assets@3.0.5','icon-only.jpg','icon-foreground.jpg','icon-background.jpg','splash-dark.jpg','--assetPath']) requireText(apply,marker,`Native branding generator is missing ${marker}.`);
          const init=readFileSync(join(root,'scripts','native-init.mjs'),'utf8');
          requireText(init,"run(process.platform === 'win32' ? 'npm.cmd' : 'npm', ['run', 'native:brand']);",'native:init must generate native branding after Capacitor sync.');
          const ux=readFileSync(join(root,'www','ux.js'),'utf8');
          requireText(ux,"const FABRI_CADABRA_VERSION='1.0.4';",'Browser version marker must be 1.0.4.');
          requireText(ux,"data-changelog-version='1.0.3'",'Historical v1.0.3 changelog entry must be retained.');
          requireText(ux,'new Fabri-Cadabra launcher icon','v1.0.4 changelog must disclose the new launcher icon.');
          requireText(ux,'branded launch screen','v1.0.4 changelog must disclose the branded launch screen.');
          console.log('Fabri-Cadabra v1.0.4 native branding contract: OK');
          EOF

      - name: Refresh lockfile and verify focused branding
        working-directory: fabrication_pro_capacitor
        run: |
          npm install --package-lock-only --ignore-scripts
          npm run verify:native-branding

      - name: Run full Fabri-Cadabra verification
        working-directory: fabrication_pro_capacitor
        run: npm run verify

      - name: Commit verified v1.0.4 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fabrication_pro_capacitor
          git commit -m 'feat: add Fabri-Cadabra native branding for v1.0.4'
          git push origin HEAD:feature/v1.0.4-native-branding-release10
