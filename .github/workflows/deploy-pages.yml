name: Deploy Fabrication Pro Web App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'fabrication_pro_capacitor/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify preserved Fabrication Pro app
        run: npm run verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Fabrication Pro web app
        uses: actions/upload-pages-artifact@v4
        with:
          path: fabrication_pro_capacitor/www

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Fabrication Pro
        id: deployment
        uses: actions/deploy-pages@v5
