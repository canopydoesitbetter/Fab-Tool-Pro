name: Apply Shift Schedule Dialog Personalization

on:
  push:
    branches: [ work ]
    paths:
      - '.github/workflows/apply-shift-dialog-personalization.yml'
      - 'fabrication_pro_capacitor/scripts/apply-shift-dialog-personalization.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout work
        uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fabrication_pro_capacitor/package-lock.json

      - name: Install dependencies
        working-directory: fabrication_pro_capacitor
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: fabrication_pro_capacitor
        run: npx playwright install --with-deps chromium

      - name: Apply Shift Schedule confirmation fix
        working-directory: fabrication_pro_capacitor
        run: node scripts/apply-shift-dialog-personalization.mjs

      - name: Verify source and release contracts
        working-directory: fabrication_pro_capacitor
        run: npm run verify

      - name: Run browser regression tests
        working-directory: fabrication_pro_capacitor
        run: npm run test:e2e

      - name: Check generated diff
        run: |
          git diff --check
          git status --short

      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fabrication_pro_capacitor/www/app/settings.js \
                  fabrication_pro_capacitor/www/index.html \
                  fabrication_pro_capacitor/release.json
          if git diff --cached --quiet; then
            echo 'No generated fix changes to commit.'
            exit 1
          fi
          git commit -m 'fix: personalize Shift Schedule confirmations'
          git push origin HEAD:work
