name: Implement Collapsible Task Logging Jobs

on:
  push:
    branches:
      - feature/v1.0.4-collapsible-jobs
    paths:
      - .github/workflows/implement-v1.0.4-collapsible-jobs.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.4-collapsible-jobs
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 .github/scripts/patch-collapsible-jobs.py
      - name: Install
        working-directory: fabrication_pro_capacitor
        run: npm install --ignore-scripts --package-lock=false
      - name: Verify focused regression
        working-directory: fabrication_pro_capacitor
        run: npm run verify:ux-polish
      - name: Verify complete app
        working-directory: fabrication_pro_capacitor
        run: npm run verify
      - name: Check diff
        run: git diff --check
      - name: Clean temporary scaffolding
        run: rm -f .github/workflows/audit-v1.0.4-collapsible-jobs-red.yml .github/workflows/implement-v1.0.4-collapsible-jobs.yml .github/scripts/patch-collapsible-jobs.py
      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: make task logging jobs collapsible'
          git push origin HEAD:feature/v1.0.4-collapsible-jobs
