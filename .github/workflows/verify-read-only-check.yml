name: Finalize Fabri-Cadabra v1.0.6

on:
  push:
    branches: [ work ]
    paths:
      - '.github/workflows/verify-read-only-check.yml'

permissions:
  contents: write

jobs:
  finalize-v106:
    name: Finalize v1.0.6 metadata and changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work
        uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Finalize release metadata and changelog
        working-directory: fabrication_pro_capacitor
        run: |
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          root = Path.cwd()
          package_path = root / 'package.json'
          lock_path = root / 'package-lock.json'
          release_path = root / 'release.json'
          index_path = root / 'www' / 'index.html'

          package = json.loads(package_path.read_text())
          if package.get('version') != '1.0.5':
              raise SystemExit(f"Expected package version 1.0.5, found {package.get('version')}")
          package['version'] = '1.0.6'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          lock = json.loads(lock_path.read_text())
          if lock.get('version') != '1.0.5' or lock.get('packages', {}).get('', {}).get('version') != '1.0.5':
              raise SystemExit('Expected package-lock release metadata to be 1.0.5.')
          lock['version'] = '1.0.6'
          lock['packages']['']['version'] = '1.0.6'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          release = json.loads(release_path.read_text())
          expected = {'version': '1.0.5', 'buildNumber': 1000013, 'previousVersion': '1.0.4'}
          if release != expected:
              raise SystemExit(f'Unexpected release.json baseline: {release!r}')
          release.update(version='1.0.6', buildNumber=1000014, previousVersion='1.0.5')
          release_path.write_text(json.dumps(release, indent=2) + '\n')

          html = index_path.read_text()
          if "data-changelog-version='1.0.6'" in html:
              raise SystemExit('A 1.0.6 changelog entry already exists.')
          old_current = "<span id='settingsCurrentChangelogVersion' class='changelog-version-label'>Version 1.0.5</span>"
          if old_current not in html:
              raise SystemExit('Could not find the current 1.0.5 changelog label.')
          html = html.replace(old_current, "<span class='changelog-version-label'>Version 1.0.5</span>", 1)
          marker = "      <article class='changelog-entry changelog-release' data-changelog-version='1.0.5'>"
          if marker not in html:
              raise SystemExit('Could not find the 1.0.5 changelog insertion point.')
          encoded = ''
          entry = base64.b64decode(encoded).decode()
          html = html.replace(marker, entry + '\n' + marker, 1)
          index_path.write_text(html)
          PY

      - name: Synchronize generated version markers
        working-directory: fabrication_pro_capacitor
        run: npm run sync:version

      - name: Verify complete release contract
        working-directory: fabrication_pro_capacitor
        run: npm run verify

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit finalized v1.0.6 release to work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fabrication_pro_capacitor/package.json fabrication_pro_capacitor/package-lock.json fabrication_pro_capacitor/release.json fabrication_pro_capacitor/www/app/bootstrap.js fabrication_pro_capacitor/www/index.html
          if git diff --cached --quiet; then
            echo "Expected v1.0.6 release changes were not produced."
            exit 1
          fi
          git commit -m "release: finalize v1.0.6"
          git push origin HEAD:work
