name: Finalize Fabri-Cadabra v1.0.6

on:
  push:
    branches: [ work ]
    paths:
      - '.github/workflows/finalize-v1.0.6.yml'

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize v1.0.6 metadata and changelog
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Checkout work
        uses: actions/checkout@v4
        with:
          ref: work
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Finalize release metadata and changelog
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const root=process.cwd();

          const pkgPath=path.join(root,'package.json');
          const lockPath=path.join(root,'package-lock.json');
          const releasePath=path.join(root,'release.json');
          const indexPath=path.join(root,'www','index.html');

          const pkg=JSON.parse(fs.readFileSync(pkgPath,'utf8'));
          if (pkg.version!=='1.0.5') throw new Error(`Expected package version 1.0.5 before finalizing 1.0.6; found ${pkg.version}`);
          pkg.version='1.0.6';
          fs.writeFileSync(pkgPath,JSON.stringify(pkg,null,2)+'\n');

          const lock=JSON.parse(fs.readFileSync(lockPath,'utf8'));
          if (lock.version!=='1.0.5' || lock.packages?.['']?.version!=='1.0.5') throw new Error('Expected package-lock release metadata to be 1.0.5 before finalizing 1.0.6.');
          lock.version='1.0.6';
          lock.packages[''].version='1.0.6';
          fs.writeFileSync(lockPath,JSON.stringify(lock,null,2)+'\n');

          const release=JSON.parse(fs.readFileSync(releasePath,'utf8'));
          if (release.version!=='1.0.5' || release.buildNumber!==1000013 || release.previousVersion!=='1.0.4') throw new Error('Unexpected release.json baseline; refusing to rewrite release history.');
          release.version='1.0.6';
          release.buildNumber=1000014;
          release.previousVersion='1.0.5';
          fs.writeFileSync(releasePath,JSON.stringify(release,null,2)+'\n');

          let html=fs.readFileSync(indexPath,'utf8');
          if (html.includes("data-changelog-version='1.0.6'")) throw new Error('A 1.0.6 changelog entry already exists; refusing to duplicate it.');
          const currentSpan="<span id='settingsCurrentChangelogVersion' class='changelog-version-label'>Version 1.0.5</span>";
          if (!html.includes(currentSpan)) throw new Error('Could not find the current 1.0.5 changelog version label.');
          html=html.replace(currentSpan,"<span class='changelog-version-label'>Version 1.0.5</span>");
          const marker="      <article class='changelog-entry changelog-release' data-changelog-version='1.0.5'>";
          if (!html.includes(marker)) throw new Error('Could not find the 1.0.5 changelog entry insertion point.');
          const entry=`      <article class='changelog-entry changelog-release' data-changelog-version='1.0.6'>
        <div class='changelog-entry-heading'>
          <div>
            <span id='settingsCurrentChangelogVersion' class='changelog-version-label'>Version 1.0.6</span>
            <h2>Per-Task Notes &amp; Safer Note Clearing</h2>
          </div>
        </div>
        <ul>
          <li><b>Task Logging Notes:</b> Added a polished note button to every task assigned to a job, with a distinct highlighted state when that task contains a saved note.</li>
          <li><b>Task Note Editor:</b> Added a smooth mobile-friendly, dark-mode-aware note dialog with multiline editing, a 4,000-character limit, live character count, Save, Cancel, Clear Note, keyboard focus handling, Escape/backdrop cancellation, and Ctrl/Cmd+Enter save support.</li>
          <li><b>Persistent &amp; Portable Notes:</b> Task notes save directly with the assigned task, survive app restarts, remain backward-compatible with older Task Logging data, and travel with Task Logging job exports/imports and full Fabri-Cadabra backups.</li>
          <li><b>Clear Note Protection:</b> Clear Note now opens the shared Fabri-Cadabra confirmation warning with Keep Note and destructive Clear Note actions, preventing accidental note deletion while preserving the note editor when cancellation is chosen.</li>
          <li><b>Regression Protection:</b> Added permanent verification coverage for task-note normalization, persistence, import/export serialization, note-state UI, editor controls, and the required clear-note confirmation guard.</li>
        </ul>
      </article>`;
          html=html.replace(marker,entry+'\n'+marker);
          fs.writeFileSync(indexPath,html);
          NODE

      - name: Synchronize generated version markers
        run: npm run sync:version

      - name: Verify complete release contract
        run: npm run verify

      - name: Verify clean patch formatting
        run: git diff --check
        working-directory: .

      - name: Commit finalized v1.0.6 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fabrication_pro_capacitor/package.json fabrication_pro_capacitor/package-lock.json fabrication_pro_capacitor/release.json fabrication_pro_capacitor/www/app/bootstrap.js fabrication_pro_capacitor/www/index.html
          git diff --cached --exit-code && { echo 'Expected release changes were not produced.'; exit 1; } || true
          git commit -m "release: finalize v1.0.6"
          git push origin HEAD:work
        working-directory: .
