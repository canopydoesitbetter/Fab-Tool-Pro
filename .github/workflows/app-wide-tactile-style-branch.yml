name: App-wide Tactile Style Branch Verification

on:
  push:
    branches: [ feature/app-wide-tactile-style ]
    paths:
      - '.github/workflows/app-wide-tactile-style-branch.yml'
      - 'fabrication_pro_capacitor/scripts/apply-app-wide-tactile-style.mjs'

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/app-wide-tactile-style
          fetch-depth: 2

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm tactile style contract is red before implementation
        run: |
          set +e
          node --input-type=module <<'NODE' > /tmp/tactile-red.log 2>&1
          import { readFileSync } from 'node:fs';
          const styles=readFileSync('www/styles.css','utf8');
          const required=[
            'button:not(:disabled)',
            '@media (hover:hover) and (pointer:fine)',
            'transform:translateY(1px) scale(.985)',
            '@media (prefers-reduced-motion: reduce)',
            '--panel-pencil:',
            '--panel-depth:',
            '.tool-panel > .tasklog-workspace > .card',
            '0 0 0 3px var(--panel-pencil)',
            '0 0 0 6px var(--panel-pencil-soft)'
          ];
          const missing=required.filter(marker=>!styles.includes(marker));
          if(missing.length) throw new Error(`Tactile style contract missing: ${missing.join(' | ')}`);
          NODE
          status=$?
          set -e
          cat /tmp/tactile-red.log
          if [ "$status" -eq 0 ]; then
            echo "::error::Tactile styling regression check unexpectedly passed before implementation."
            exit 1
          fi
          grep -F 'Tactile style contract missing:' /tmp/tactile-red.log
          echo 'Expected RED state confirmed.'

      - name: Apply approved visual styling
        run: node scripts/apply-app-wide-tactile-style.mjs

      - name: Run full verification suite
        run: npm run verify

      - name: Check production diff whitespace
        working-directory: .
        run: git diff --check

      - name: Commit verified production source
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fabrication_pro_capacitor/www/styles.css fabrication_pro_capacitor/scripts/verify-features.mjs
          git diff --cached --quiet && { echo '::error::Styling updater produced no source changes.'; exit 1; }
          git commit -m 'Add tactile buttons and pencil panel depth'
          git push origin HEAD:feature/app-wide-tactile-style
