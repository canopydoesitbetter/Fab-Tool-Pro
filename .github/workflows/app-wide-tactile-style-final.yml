name: Final App-wide Tactile Style Verification

on:
  push:
    branches: [ feature/app-wide-tactile-style ]
    paths:
      - '.github/workflows/app-wide-tactile-style-final.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabrication_pro_capacitor
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/app-wide-tactile-style
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full verification suite
        run: npm run verify
      - name: Check production diff whitespace
        working-directory: .
        run: git diff --check origin/main...HEAD -- fabrication_pro_capacitor/www/styles.css fabrication_pro_capacitor/scripts/verify-features.mjs
