name: Implement Task Logging Job Rename

on:
  push:
    branches: [ feature/v1.0.3-tasklog-job-rename ]
    paths:
      - '.github/workflows/implement-tasklog-job-rename.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.3-tasklog-job-rename
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Implement confirmed rename overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root=Path('fabrication_pro_capacitor')

          def replace_once(path,old,new,label):
              text=path.read_text()
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              path.write_text(text.replace(old,new,1))

          index=root/'www/index.html'
          replace_once(
              index,
              '''              <label for="taskLogJobTitle">Job # / Name</label>\n              <input id="taskLogJobTitle" class="tasklog-job-title" type="text" maxlength="120" autocomplete="off" placeholder="Example: 26-0814-01" />''',
              '''              <label for="taskLogJobTitle">Job # / Name</label>\n              <button id="taskLogJobTitle" class="tasklog-job-title tasklog-job-title-button" type="button" aria-haspopup="dialog" aria-controls="taskLogRenameDialog">Job</button>''',
              'replace active job name input'
          )
          rename_markup='''      <div id="taskLogRenameBackdrop" class="tasklog-rename-backdrop" aria-hidden="true"></div>\n      <section id="taskLogRenameDialog" class="tasklog-rename-dialog" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="taskLogRenameTitle">\n        <div class="tasklog-rename-panel">\n          <h2 id="taskLogRenameTitle">Edit Job Name</h2>\n          <p>Enter the new Job # / Name below. The current job will not change until you confirm it.</p>\n          <label for="taskLogRenameInput">Job # / Name</label>\n          <input id="taskLogRenameInput" type="text" maxlength="120" autocomplete="off" placeholder="Example: 26-0814-01" />\n          <div id="taskLogRenameStatus" class="status" role="status" aria-live="polite"></div>\n          <div class="tasklog-rename-actions">\n            <button id="taskLogRenameCancelBtn" class="btn secondary" type="button">Cancel</button>\n            <button id="taskLogRenameApplyBtn" class="btn" type="button">Apply Name Change</button>\n          </div>\n        </div>\n      </section>\n\n'''
          replace_once(
              index,
              '      <div id="taskLogPresetBackdrop" class="cut-list-backdrop" aria-hidden="true"></div>',
              rename_markup+'      <div id="taskLogPresetBackdrop" class="cut-list-backdrop" aria-hidden="true"></div>',
              'insert rename dialog'
          )

          app=root/'www/app.js'
          replace_once(
              app,
              "  const taskLogJobTitle = document.getElementById('taskLogJobTitle');\n  const taskLogJobTotal = document.getElementById('taskLogJobTotal');",
              "  const taskLogJobTitle = document.getElementById('taskLogJobTitle');\n  const taskLogRenameBackdrop = document.getElementById('taskLogRenameBackdrop');\n  const taskLogRenameDialog = document.getElementById('taskLogRenameDialog');\n  const taskLogRenameInput = document.getElementById('taskLogRenameInput');\n  const taskLogRenameCancelBtn = document.getElementById('taskLogRenameCancelBtn');\n  const taskLogRenameApplyBtn = document.getElementById('taskLogRenameApplyBtn');\n  const taskLogRenameStatus = document.getElementById('taskLogRenameStatus');\n  const taskLogJobTotal = document.getElementById('taskLogJobTotal');",
              'add rename DOM references'
          )
          rename_core='''// @tasklog-job-rename-core-start\nfunction normalizeTaskLogJobName(value,maxLength=120) {\n  const clean=String(value ?? '').trim().replace(/\\s+/g,' ');\n  if (!clean) return null;\n  const limit=Number.isInteger(maxLength) && maxLength>0 ? maxLength : 120;\n  return clean.slice(0,limit);\n}\n\nfunction applyTaskLogJobRename(job,value,updatedAt,maxLength=120) {\n  if (!job || typeof job!=='object') return false;\n  const clean=normalizeTaskLogJobName(value,maxLength);\n  if (!clean) return false;\n  job.title=clean;\n  job.updatedAt=String(updatedAt || new Date().toISOString());\n  return true;\n}\n// @tasklog-job-rename-core-end\n\n'''
          replace_once(
              app,
              '  let taskLogSelectedPresetIds = new Set();\n\n// @shift-schedule-core-start',
              '  let taskLogSelectedPresetIds = new Set();\n\n'+rename_core+'// @shift-schedule-core-start',
              'insert rename core'
          )
          dialog_functions='''  function setTaskLogRenameDialogOpen(open) {\n    taskLogRenameBackdrop.classList.toggle('open',open);\n    taskLogRenameDialog.classList.toggle('open',open);\n    taskLogRenameBackdrop.setAttribute('aria-hidden',open?'false':'true');\n    taskLogRenameDialog.setAttribute('aria-hidden',open?'false':'true');\n    if (open) {\n      requestAnimationFrame(()=>{\n        taskLogRenameInput.focus({preventScroll:true});\n        taskLogRenameInput.select();\n      });\n    } else {\n      taskLogRenameStatus.textContent='';\n      taskLogRenameStatus.className='status';\n      requestAnimationFrame(()=>taskLogJobTitle.focus({preventScroll:true}));\n    }\n  }\n\n  function openTaskLogRenameDialog() {\n    const job=activeTaskLogJob();\n    if (!job) return;\n    taskLogRenameInput.value=job.title;\n    taskLogRenameStatus.textContent='';\n    taskLogRenameStatus.className='status';\n    setTaskLogRenameDialogOpen(true);\n  }\n\n  function applyTaskLogJobRenameFromDialog() {\n    const job=activeTaskLogJob();\n    if (!job) { setTaskLogRenameDialogOpen(false); return; }\n    if (!applyTaskLogJobRename(job,taskLogRenameInput.value,new Date().toISOString(),MAX_TASK_LOG_NAME)) {\n      taskLogRenameStatus.textContent='Enter a job name before applying the change.';\n      taskLogRenameStatus.className='status error show';\n      taskLogRenameInput.focus({preventScroll:true});\n      return;\n    }\n    persistTaskLogJobs(true);\n    renderTaskLogging();\n    setTaskLogRenameDialogOpen(false);\n    showTaskLogStatus(`Job name changed to ${job.title}.`,'ok');\n  }\n\n  function trapTaskLogRenameFocus(event) {\n    if (event.key!=='Tab' || !taskLogRenameDialog.classList.contains('open')) return;\n    const focusable=[taskLogRenameInput,taskLogRenameCancelBtn,taskLogRenameApplyBtn].filter(el=>el && !el.disabled);\n    if (!focusable.length) { event.preventDefault(); return; }\n    const first=focusable[0],last=focusable[focusable.length-1];\n    if (event.shiftKey && document.activeElement===first) { event.preventDefault(); last.focus(); }\n    else if (!event.shiftKey && document.activeElement===last) { event.preventDefault(); first.focus(); }\n  }\n\n'''
          replace_once(
              app,
              '  function renderTaskLogEditor() {',
              dialog_functions+'  function renderTaskLogEditor() {',
              'insert rename interaction functions'
          )
          replace_once(
              app,
              '    taskLogJobTitle.value=job.title;',
              "    taskLogJobTitle.textContent=job.title;\n    taskLogJobTitle.title='Edit job name';\n    taskLogJobTitle.setAttribute('aria-label',`Edit job name: ${job.title}`);",
              'render job name button'
          )
          replace_once(
              app,
              '    requestAnimationFrame(()=>{ taskLogJobTitle.focus(); taskLogJobTitle.select(); });',
              '    requestAnimationFrame(()=>taskLogJobTitle.focus());',
              'preserve new-job focus without input select'
          )
          old_handlers='''  taskLogJobTitle.addEventListener('input',()=>{\n    const job=activeTaskLogJob();\n    if (!job) return;\n    const value=taskLogJobTitle.value.slice(0,MAX_TASK_LOG_NAME);\n    job.title=value;\n    job.updatedAt=new Date().toISOString();\n    scheduleTaskLogJobsSave();\n    renderTaskLogJobs();\n  });\n  taskLogJobTitle.addEventListener('blur',()=>{\n    const job=activeTaskLogJob();\n    if (!job) return;\n    const clean=String(job.title||'').trim().replace(/\\s+/g,' ');\n    if (!clean) { job.title=`Job ${job.id}`; taskLogJobTitle.value=job.title; }\n    else { job.title=clean; taskLogJobTitle.value=clean; }\n    job.updatedAt=new Date().toISOString();\n    persistTaskLogJobs(true); renderTaskLogJobs();\n  });'''
          new_handlers='''  taskLogJobTitle.addEventListener('click',openTaskLogRenameDialog);\n  taskLogRenameCancelBtn.addEventListener('click',()=>setTaskLogRenameDialogOpen(false));\n  taskLogRenameApplyBtn.addEventListener('click',applyTaskLogJobRenameFromDialog);\n  taskLogRenameBackdrop.addEventListener('click',()=>setTaskLogRenameDialogOpen(false));\n  taskLogRenameInput.addEventListener('input',()=>{\n    taskLogRenameStatus.textContent='';\n    taskLogRenameStatus.className='status';\n  });\n  taskLogRenameDialog.addEventListener('keydown',event=>{\n    if (event.key==='Escape') {\n      event.preventDefault();\n      event.stopPropagation();\n      setTaskLogRenameDialogOpen(false);\n      return;\n    }\n    trapTaskLogRenameFocus(event);\n  });'''
          replace_once(app,old_handlers,new_handlers,'replace live rename handlers')

          uxcss=root/'www/ux.css'
          css=uxcss.read_text()
          css_marker='/* ---------------- Task Logging confirmed job rename ---------------- */'
          if css_marker in css:
              raise SystemExit('rename CSS already present unexpectedly')
          css += '''\n\n/* ---------------- Task Logging confirmed job rename ---------------- */\n.tasklog-job-title-button {\n  width:100%;\n  min-height:50px;\n  display:flex;\n  align-items:center;\n  justify-content:space-between;\n  gap:12px;\n  padding:10px 13px;\n  border:2px solid var(--input-border);\n  border-radius:12px;\n  background:var(--input);\n  color:var(--text);\n  font-size:1.08rem;\n  font-weight:850;\n  text-align:left;\n}\n.tasklog-job-title-button::after {\n  content:'Edit';\n  flex:0 0 auto;\n  color:var(--accent);\n  font-size:.74rem;\n  font-weight:950;\n  letter-spacing:.035em;\n  text-transform:uppercase;\n}\n.tasklog-job-title-button:focus-visible {\n  outline:none;\n  border-color:var(--accent);\n  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent),0 3px 0 var(--button-edge),var(--button-depth);\n}\n.tasklog-rename-backdrop {\n  position:fixed;\n  inset:0;\n  z-index:240;\n  background:rgba(3,12,20,.62);\n  opacity:0;\n  visibility:hidden;\n  transition:opacity .18s ease,visibility .18s ease;\n}\n.tasklog-rename-backdrop.open {\n  opacity:1;\n  visibility:visible;\n}\n.tasklog-rename-dialog {\n  position:fixed;\n  left:50%;\n  top:50%;\n  z-index:250;\n  width:min(520px,calc(100vw - 28px));\n  max-height:calc(100vh - 28px);\n  padding:18px;\n  border:1px solid var(--border);\n  border-radius:18px;\n  background:var(--card);\n  color:var(--text);\n  box-shadow:0 24px 70px rgba(0,0,0,.38);\n  transform:translate(-50%,-46%) scale(.97);\n  opacity:0;\n  visibility:hidden;\n  overflow-y:auto;\n  overscroll-behavior:contain;\n  transition:transform .18s ease,opacity .18s ease,visibility .18s ease;\n}\n.tasklog-rename-dialog.open {\n  transform:translate(-50%,-50%) scale(1);\n  opacity:1;\n  visibility:visible;\n}\n.tasklog-rename-panel h2 {\n  margin:0 0 7px;\n  color:var(--accent);\n  font-size:1.2rem;\n}\n.tasklog-rename-panel > p {\n  margin:0 0 16px;\n  color:var(--muted);\n  font-size:.88rem;\n  line-height:1.42;\n}\n.tasklog-rename-actions {\n  display:grid;\n  grid-template-columns:1fr 1fr;\n  gap:10px;\n  margin-top:14px;\n}\n.tasklog-rename-actions .btn {\n  width:100%;\n  min-width:0;\n}\n@media (max-width:480px) {\n  .tasklog-rename-dialog {\n    width:calc(100vw - 20px);\n    padding:15px;\n    border-radius:15px;\n  }\n  .tasklog-rename-actions {\n    grid-template-columns:1fr;\n  }\n}\n@media (prefers-reduced-motion: reduce) {\n  .tasklog-rename-backdrop,\n  .tasklog-rename-dialog {\n    transition:none;\n  }\n}\n@media print {\n  #taskLogRenameBackdrop,\n  #taskLogRenameDialog {\n    display:none !important;\n  }\n}\n'''
          uxcss.write_text(css)

          ux=root/'www/ux.js'
          old_changelog='''          <li>The Task Logging Jobs panel is now collapsible and starts closed by default, matching Task Logging Management while preserving the same saved jobs, totals, running indicators, and job-selection behavior.</li>'''
          new_changelog=old_changelog+'''\n          <li>Job # / Name now opens a dedicated rename overlay. The job name changes only after pressing Apply Name Change, with Cancel and outside-dismiss leaving the existing name untouched.</li>'''
          replace_once(ux,old_changelog,new_changelog,'append final v1.0.3 changelog item')

          settings_verify=root/'scripts/verify-settings-changelog.mjs'
          replace_once(
              settings_verify,
              "for (const concept of ['phone-friendly','730 for 7:30','AM/PM selector','impossible times','Task Logging Jobs panel is now collapsible'])",
              "for (const concept of ['phone-friendly','730 for 7:30','AM/PM selector','impossible times','Task Logging Jobs panel is now collapsible','Job # / Name now opens a dedicated rename overlay'])",
              'extend v1.0.3 changelog regression'
          )

          package=root/'package.json'
          replace_once(
              package,
              '"verify:shift-schedule-behavior": "node scripts/verify-shift-schedule-behavior.mjs",\n    "verify:smart-time": "node scripts/verify-smart-time-input.mjs"',
              '"verify:shift-schedule-behavior": "node scripts/verify-shift-schedule-behavior.mjs",\n    "verify:smart-time": "node scripts/verify-smart-time-input.mjs",\n    "verify:tasklog-job-rename": "node scripts/verify-tasklog-job-rename.mjs"',
              'add focused rename verifier script'
          )
          replace_once(
              package,
              'npm run verify:shift-schedule-behavior && npm run verify:smart-time && npm run verify:style-cascade',
              'npm run verify:shift-schedule-behavior && npm run verify:smart-time && npm run verify:tasklog-job-rename && npm run verify:style-cascade',
              'add focused verifier to aggregate verification'
          )
          PY
      - name: Install dependencies
        working-directory: fabrication_pro_capacitor
        run: npm install --ignore-scripts --package-lock=false
      - name: Verify focused rename behavior
        working-directory: fabrication_pro_capacitor
        run: npm run verify:tasklog-job-rename
      - name: Verify complete Fabri-Cadabra suite
        working-directory: fabrication_pro_capacitor
        run: npm run verify
      - name: Syntax and diff checks
        run: |
          node --check fabrication_pro_capacitor/www/app.js
          node --check fabrication_pro_capacitor/www/ux.js
          git diff --check
      - name: Remove temporary implementation workflows
        run: |
          rm -f .github/workflows/audit-tasklog-job-rename-red.yml
          rm -f .github/workflows/implement-tasklog-job-rename.yml
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'feat: add confirmed task log job rename overlay'
          git push origin HEAD:feature/v1.0.3-tasklog-job-rename
